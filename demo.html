<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIL_3100 | 3D Graphics & Physics Engine</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020617;
      font-family: 'Courier New', Courier, monospace;
      color: #00ffcc;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
    }
    #hud-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid #00ffcc;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
      pointer-events: none;
    }
    .hud-title {
      font-size: 16px;
      font-weight: bold;
      color: #00ffcc;
      border-bottom: 1px solid #00ffcc;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
    .hud-stat {
      font-size: 13px;
      margin: 4px 0;
    }
    .val-pink { color: #ff0055; }
    .val-yellow { color: #facc15; }
    .val-cyan { color: #00ffcc; }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud-overlay">
    <div class="hud-title">⚙️ MIL_3100 NEURO-GRAPHICS HUD</div>
    <div class="hud-stat">CARDIAC LOOP: <span id="hud-bpm" class="val-pink">0 BPM</span></div>
    <div class="hud-stat">PAIN INDEX: <span id="hud-pain" class="val-pink">0/100</span></div>
    <div class="hud-stat">BRACE STRESS: <span id="hud-stress" class="val-yellow">0%</span></div>
    <div class="hud-stat">GAIT ANGLE: <span id="hud-angle" class="val-cyan">0°</span></div>
    <div class="hud-stat">TREMOR SHAKE: <span id="hud-tremor" class="val-cyan">0.00</span></div>
  </div>

  <div id="webgl-container"></div>

  <script>
    // --- 1. MOCK ENGINE LOGIC FOR 3D BINDING ---
    const biomechanics = {
      bpm: 112,
      painIndex: 62,
      braceStress: 84.2,
      tremor: 0.042,
      tick: 0,
      update() {
        this.tick += 0.05;
        this.bpm = 100 + Math.sin(this.tick) * 15;
        this.braceStress = 70 + Math.cos(this.tick * 0.8) * 15;
        this.tremor = 0.02 + Math.sin(this.tick * 2) * 0.02;
        this.gaitAngle = Math.sin(this.tick) * 0.4; // Limping gait cycle
      }
    };

    // --- 2. THREE.JS SCENE SETUP ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020617, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- 3. LIGHTING (CYBERPUNK NEON) ---
    const ambientLight = new THREE.AmbientLight(0x0f172a, 1.5);
    scene.add(ambientLight);

    const cyanPointLight = new THREE.PointLight(0x00ffcc, 2, 10);
    cyanPointLight.position.set(-2, 2, 1);
    scene.add(cyanPointLight);

    const redSpotLight = new THREE.SpotLight(0xff0055, 3);
    redSpotLight.position.set(2, 4, 2);
    redSpotLight.castShadow = true;
    scene.add(redSpotLight);

    // --- 4. ENVIRONMENT (FLOOR GRID) ---
    const gridHelper = new THREE.GridHelper(50, 50, 0x00ffcc, 0x1e293b);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // --- 5. PROCEDURAL 3D BRACE & LEG MESH ---
    const legGroup = new THREE.Group();

    // Thigh Mesh
    const thighGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.6, 16);
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
    const thighMesh = new THREE.Mesh(thighGeo, darkMat);
    thighMesh.position.y = 0.6;
    legGroup.add(thighMesh);

    // Mechanical Brace Joint (Gear Mesh)
    const jointGeo = new THREE.TorusGeometry(0.1, 0.03, 16, 32);
    const braceMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.8, roughness: 0.2 });
    const jointMesh = new THREE.Mesh(jointGeo, braceMat);
    jointMesh.position.y = 0.3;
    jointMesh.rotation.x = Math.PI / 2;
    legGroup.add(jointMesh);

    // Shin / Lower Brace Mesh
    const shinGeo = new THREE.CylinderGeometry(0.06, 0.04, 0.6, 16);
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9, roughness: 0.1 });
    const shinMesh = new THREE.Mesh(shinGeo, metalMat);
    shinMesh.position.y = 0;
    legGroup.add(shinMesh);

    legGroup.position.set(0, 0.5, 0);
    scene.add(legGroup);

    // --- 6. ANIMATION & LOGIC BINDING LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Update Engine Logic
      biomechanics.update();

      // Procedural Limping Animation (Driven by Logic)
      legGroup.rotation.z = biomechanics.gaitAngle;
      jointMesh.rotation.z += 0.02; // Rotating Brace Gear

      // Camera Tremor Effect (Driven by Neuro Trauma)
      camera.position.x = (Math.random() - 0.5) * biomechanics.tremor;
      camera.position.y = 1.6 + (Math.random() - 0.5) * biomechanics.tremor;

      // Update HUD Indicators
      document.getElementById('hud-bpm').innerText = `${Math.round(biomechanics.bpm)} BPM`;
      document.getElementById('hud-pain').innerText = `${biomechanics.painIndex}/100`;
      document.getElementById('hud-stress').innerText = `${biomechanics.braceStress.toFixed(1)}%`;
      document.getElementById('hud-angle').innerText = `${(biomechanics.gaitAngle * 57.3).toFixed(1)}°`;
      document.getElementById('hud-tremor').innerText = biomechanics.tremor.toFixed(3);

      renderer.render(scene, camera);
    }

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
